[metadata]
name = tssbaa-lab
version = 0.1.0
description = 5G SBA Attack & Defence Lab simulation
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
install_requires =
    fastapi>=0.110.0
    uvicorn[standard]>=0.29.0
    httpx>=0.27.0
    pydantic>=2.6.0
    python-jose>=3.3.0
    rich>=13.7.1
    typer>=0.9.0
python_requires = >=3.10
include_package_data = True

[options.packages.find]
include = core*,attacks*,defence*,monitoring*
