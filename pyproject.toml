[project]
name = "tssbaa-lab"
version = "0.1.0"
description = "5G SBA Attack & Defence Lab simulation"
authors = [{name = "Lab Maintainers", email = "maintainers@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-jose>=3.3.0",
    "rich>=13.7.1",
    "typer>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "A" ,"C4", "SIM", "PL"]
ignore = ["S101", "S104", "S105", "S106", "PLR2004", "PLR0913"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
